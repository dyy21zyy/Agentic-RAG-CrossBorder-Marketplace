name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Focused v1 contract tests
        run: >-
          pytest -q
          tests/test_v1_schema_contracts.py
          tests/test_v1_config_registry.py
          tests/test_v1_llm_client.py
          tests/test_v1_report_builder.py
          tests/test_v1_agentic_runtime.py
          tests/test_v1_trace_adapters.py
          tests/test_v1_mcp_tools.py
          tests/test_v1_dashboard_services.py
          tests/test_v1_evaluation_runner.py
          tests/test_v1_cli_contracts.py
      - name: Existing fixture gate
        run: >-
          pytest -q
          tests/test_stage1_core_interfaces.py
          tests/test_stage2_parsers.py
          tests/test_stage3_chunkers.py
          tests/test_stage6_agent_workflow.py
          tests/test_stage8_end_to_end.py
      - name: Full test suite
        run: pytest -q
