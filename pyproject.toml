[project]
name = "crossborder-agentic-rag"
version = "0.1.0"
description = "Agentic RAG for cross-border marketplace intellectual property QA"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "duckdb>=0.10",
    "requests>=2.31",
    "networkx>=3.0",
    "langchain>=0.2",
    "langchain-core>=0.2",
]

[project.optional-dependencies]
llm = [
    "langchain-openai>=0.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
local = [
    "sentence-transformers>=2.0",
]
milvus = [
    "pymilvus>=2.4",
]
reranker = [
    "sentence-transformers>=2.0",
]
duckdb = [
    "duckdb>=0.10",
]
pdf = [
    "pypdf>=4.0",
]
html = [
    "beautifulsoup4>=4.12",
]
mcp = [
    "mcp>=1.0",
]
dashboard = [
    "streamlit>=1.37",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external services such as Milvus"
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
